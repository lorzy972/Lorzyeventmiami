<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07070d">
<title>Lorzy · Door scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--bg:#07070d;--card:#12121c;--line:#25253a;--tx:#f4f4fa;--mu:#9a9ab4;--c:#16f3fe;--p:#ffa9c2;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:auto;padding:16px}
.logo{font-weight:900;letter-spacing:4px;color:var(--c);font-size:14px;text-align:center;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
input,select{width:100%;background:#0b0b14;border:1px solid var(--line);border-radius:24px;color:var(--tx);padding:13px;font:inherit;margin-bottom:10px}
.btn{background:linear-gradient(90deg,var(--c),var(--p));color:#07070d;border:0;border-radius:999px;padding:15px 18px;font-weight:800;font-size:16px;width:100%;cursor:pointer}
.b2{background:#1c1c2c;color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
.mu{color:var(--mu);font-size:13px}.big{font-size:34px;font-weight:800;text-align:center}
.row{display:flex;gap:8px}.row>*{flex:1}
.p{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
#ov{position:fixed;inset:0;z-index:9;background:#000;display:none;flex-direction:column}
#ov video{flex:1;min-height:0;width:100%;object-fit:cover}
#res{padding:calc(56px + env(safe-area-inset-top)) 14px 14px;background:#0b0b14;border-radius:0 0 24px 24px;order:-1}
#cl{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
</style></head><body><div class="w" id="app"></div>
<div id="ov"><video id="v" playsinline muted></video><div id="res"></div><button class="b2" id="cl" onclick="closeScan()">Close</button></div>
<script>
const SB=supabase.createClient('https://gjkpcybaezrqapjyhacs.supabase.co','sb_publishable_kU32UCX6xzHug58YO2wmTg_nKyTKu_r');
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let evs=[],bk=[],cur=localStorage.getItem('scEv')||'',stream=null,raf=0,last='',lastT=0,busy=false,view='home';
const evLabel=e=>e.day?new Date(e.day+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+(e.time?' · '+e.time:''):'';
const evName=id=>{const e=evs.find(x=>x.id===id);return e?(e.title+(evLabel(e)?' · '+evLabel(e):'')):id};
const mine=()=>bk.filter(b=>(b.ev||'main')===cur&&!b.wait);

async function init(){const{data}=await SB.auth.getSession();if(!data.session)return loginV();await loadAll();SB.channel('sc').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},loadBk).subscribe();home()}
function loginV(){$('#app').innerHTML=`<div class="logo">LORZY · DOOR</div><div class="card"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="login()">Log in</button></div>`}
async function login(){const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return alert('Wrong email or password');init()}
async function logout(){await SB.auth.signOut();location.reload()}
async function loadBk(){const{data}=await SB.from('bookings').select('id,data');bk=(data||[]).map(r=>({id:r.id,...r.data}));if(view==='home')home()}
async function loadAll(){const{data}=await SB.from('cfg').select('id,data');evs=(data||[]).filter(r=>r.data&&r.data.title).map(r=>({id:r.id,...r.data})).sort((a,b)=>(a.day||'').localeCompare(b.day||''));
 if(!evs.find(e=>e.id===cur)){const t=new Date().toISOString().slice(0,10),n=evs.find(e=>(e.day||'')>=t)||evs[evs.length-1];cur=n?n.id:''}await loadBk()}
function home(){view='home';const m=mine(),pd=m.filter(b=>b.paid),inn=m.filter(b=>b.in),rec=[...inn].sort((a,b)=>b.in-a.in).slice(0,15);
$('#app').innerHTML=`<div class="logo">LORZY · DOOR</div><div class="card"><select onchange="cur=this.value;localStorage.setItem('scEv',cur);home()">${evs.map(e=>`<option value="${e.id}" ${e.id===cur?'selected':''}>${esc(e.title)} · ${esc(evLabel(e))}</option>`).join('')}</select>
<div class="big">${inn.length} <span class="mu" style="font-size:16px">in / ${pd.length} paid</span></div>
<button class="btn" style="margin-top:12px" onclick="openScan()">Scan QR code</button></div>
<div class="card"><div class="mu" style="margin-bottom:6px">No camera? Type the 6-character code or a name</div><div class="row"><input id="mc" placeholder="A1B2C3 or name" style="margin:0"><button class="b2" style="flex:0 0 90px" onclick="manual()">Check</button></div></div>
<div class="card"><div class="mu">Last check-ins</div>${rec.map(p=>`<div class="p"><span>${esc(p.first)} ${esc(p.last)}<br><span class="mu">${new Date(p.in).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></span><button class="b2" onclick="undo('${p.id}')">Undo</button></div>`).join('')||'<p class="mu">Nobody yet.</p>'}</div>
<p style="text-align:center"><button class="b2" onclick="logout()">Log out</button></p>`}

function find(c){const s=c.replace(/^LORZY-/i,'').trim();if(!s)return[];const u=s.toUpperCase();
 let p=bk.find(b=>b.id===s)||bk.find(b=>u.length>=6&&b.id.slice(0,u.length).toUpperCase()===u);if(p)return[p];
 const n=s.toLowerCase();return mine().filter(b=>(b.first+' '+b.last).toLowerCase().includes(n)).slice(0,6)}
function manual(){const q=$('#mc').value;const r=find(q);if(!r.length){openOv();show(null);return}openOv();r.length===1?show(r[0]):pickList(r)}
function openOv(){$('#ov').style.display='flex';$('#v').style.display='none'}
function pickList(r){$('#res').innerHTML=r.map(p=>`<div class="p"><span>${esc(p.first)} ${esc(p.last)}<br><span class="mu">#${p.id.slice(0,6).toUpperCase()} · ${p.paid?'paid':'NOT paid'}${p.in?' · already in':''}</span></span><button class="b2" onclick="show(find('${p.id}')[0])">Open</button></div>`).join('')}
const card=(col,t,n,i,btns)=>`<div style="border:2px solid ${col};border-radius:20px;padding:14px;text-align:center"><div style="color:${col};font-weight:800;letter-spacing:2px">${t}</div><div style="font-size:26px;font-weight:700;margin:4px 0">${n}</div><div class="mu">${i}</div></div><div class="row" style="margin-top:10px">${btns||''}<button class="b2" onclick="nextScan()">Next</button></div>`;
function show(p){if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}const r=$('#res');
 if(!p){r.innerHTML=card('#ff5c7a','NOT FOUND','Unknown ticket','');return}
 const e=evs.find(x=>x.id===(p.ev||'main'))||{},info=`${esc(evName(p.ev||'main'))}<br>${p.sex==='F'?'Girl':'Guy'}${(p.friends||[]).length?' · '+p.friends.length+' friend(s)':''}`,nm=esc(p.first+' '+p.last);
 if((p.ev||'main')!==cur)r.innerHTML=card('#ffb020','WRONG EVENT',nm,info);
 else if(p.wait)r.innerHTML=card('#ff5c7a','WAITLIST ONLY',nm,info);
 else if(p.in)r.innerHTML=card('#ffb020','ALREADY IN',nm,info+'<br>Entered at '+new Date(p.in).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
 else if(p.paid)r.innerHTML=card('#6dff9c','VALID',nm,info,`<button class="btn" onclick="checkIn('${p.id}',0)">Check in</button>`);
 else r.innerHTML=card('#ff5c7a','NOT PAID',nm,info+'<br>Amount due: $'+((p.sex==='F'?e.priceF:e.priceG)-(+p.off||0)),`<button class="b2" onclick="checkIn('${p.id}',1)">Paid cash · check in</button>`)}
async function checkIn(id,cash){const{data}=await SB.from('bookings').select('data').eq('id',id).single();if(!data)return alert('Not found');
 if(data.data.in){show({id,...data.data});return}
 const v={...data.data,in:Date.now(),...(cash?{paid:true,paidAt:Date.now(),via:'cash'}:{})};const{error}=await SB.from('bookings').upsert({id,data:v});if(error)return alert(error.message);
 $('#res').innerHTML=card('#6dff9c','CHECKED IN',esc(v.first+' '+v.last),'');loadBk()}
async function undo(id){const p=bk.find(b=>b.id===id);if(!p)return;const{id:_,...r}=p;r.in=null;await SB.from('bookings').upsert({id,data:r});loadBk()}

async function openScan(){openOv();$('#res').innerHTML='<p class="mu" style="text-align:center;margin:0">Point the camera at the QR code</p>';
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#v');v.style.display='block';v.srcObject=stream;await v.play();loop()}catch(e){$('#res').innerHTML='<p style="text-align:center;margin:0">Camera blocked. Allow the camera for this site in Safari settings, or type the code.</p>'}}
function loop(){const v=$('#v');if(!stream)return;if(v.readyState>=2&&v.videoWidth&&!busy){const c=document.createElement('canvas'),k=Math.min(1,640/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
 if(r&&r.data&&(r.data!==last||Date.now()-lastT>3000)){last=r.data;lastT=Date.now();busy=true;const f=find(r.data);show(f[0]||null)}}raf=requestAnimationFrame(loop)}
function nextScan(){busy=false;last='';if(stream)$('#res').innerHTML='<p class="mu" style="text-align:center;margin:0">Point the camera at the QR code</p>';else closeScan()}
function closeScan(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;busy=false;last='';$('#ov').style.display='none';home()}
init();
</script></body></html>
