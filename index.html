.w{max-width:760px;margin:auto;padding:20px 16px 60px}.wide{max-width:1200px}
h1{font-size:34px;margin:6px 0;letter-spacing:.5px}h2{font-size:18px;margin:26px 0 10px}
.logo{font-weight:900;letter-spacing:4px;color:var(--c);font-size:14px;text-align:center;margin:10px 0}
.sub{color:var(--mu);text-align:center;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0b0b14;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--c);border-color:transparent}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:linear-gradient(90deg,var(--c),var(--p));color:#07070d;border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;width:100%;margin-top:14px}
.b2{background:#1c1c2c;color:var(--tx);border:1px solid var(--line);width:auto;margin:0;padding:8px 12px;font-size:13px;font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0b0b14;color:var(--tx);cursor:pointer;font:inherit}.seg .on{background:var(--c);color:#07070d;font-weight:800}.seg .on.f{background:var(--p)}
.fr{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;border-radius:16px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;object-fit:cover;border-radius:16px}
.det{white-space:pre-line;color:#d6d6e6}
.ok{text-align:center;padding:30px 10px}.ok b{color:var(--c);font-size:20px}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs .b2.on{background:var(--c);color:#07070d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bt h3{margin:0 0 6px;font-size:15px}.bt input{padding:7px 9px;margin-bottom:6px}
.p{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.p .n{flex:1;min-width:0}.p select{width:auto;padding:4px;font-size:12px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;color:#07070d}.tf{background:var(--p)}.tg{background:var(--c)}
.cnt{font-size:12px;color:var(--mu);margin-bottom:6px}.full{color:var(--p)}
.mu{color:var(--mu);font-size:12px}.ph{display:flex;gap:8px;flex-wrap:wrap}.ph div{position:relative}.ph img{width:90px;height:64px;object-fit:cover;border-radius:8px}.ph .x{position:absolute;top:0;right:0;background:#000a;border-radius:50%;width:22px;height:22px;font-size:13px;padding:0;color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adm,.adm input,.adm select,.adm textarea,.adm button{font-family:'Space Grotesk',system-ui,sans-serif}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"></head><body><div class="w" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const uid=()=>Math.random().toString(36).slice(2,10);
/* ===== Supabase ===== */
const SB=supabase.createClient('https://gjkpcybaezrqapjyhacs.supabase.co','sb_publishable_kU32UCX6xzHug58YO2wmTg_nKyTKu_r');
const store={
 async load(n){const{data}=await SB.from(n).select('id,data');return(data||[]).map(r=>({id:r.id,...r.data}))},
 sub(n,cb){const go=async()=>cb(await store.load(n));go();SB.channel('rt_'+n).on('postgres_changes',{event:'*',schema:'public',table:n},go).subscribe()},
 async set(n,id,v){const{error}=await SB.from(n).upsert({id,data:v});if(error)alert(error.message)},
 async add(n,id,v){const{error}=await SB.from(n).insert({id,data:v});if(error){alert('Error: '+error.message);throw error}refreshPub()},
 async del(n,id){const{error}=await SB.from(n).delete().eq('id',id);if(error)alert(error.message)}
};
const DEF={title:'Boat Party Miami',date:'',desc:'Book your spot on the boat party.',details:'📍 Departure: Miami\n⏰ Time: TBA\n🍾 Drinks: TBA\n👥 Max 12 people per boat',pin:'0972',priceF:60,priceG:130,seats:12,minG:4,boats:[{id:'b1',name:'Boat 1',captain:''},{id:'b2',name:'Boat 2',captain:''}]};
let cfg={...DEF},bookings=[],photos=[],tab='boats',authed=false,friends=[{first:'',last:''}],sex='',done=false;
const busy=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='file'};const MAXB=8,CAP=12;
const saveCfg=()=>store.set('cfg','main',cfg);
function route(){return location.hash==='#admin'}
function render(){ if(!$('#app'))return; const a=route(); document.querySelector('.w').classList.toggle('wide',a&&authed);document.body.classList.toggle('adm',a); $('#app').innerHTML=a?adminView():clientView(); if(!a)startCar()}
/* ===== client ===== */
function clientView(){
 const ph=photos.sort((a,b)=>a.o-b.o);
 return `<div class="logo">LORZY EVENTS</div><h1 style="text-align:center">${esc(cfg.title)}</h1><p class="sub">${esc(cfg.date)} ${esc(cfg.desc)}</p>`+
 (done?`<div class="card ok"><b>Request sent ✓</b><p>We’ll confirm your spot and your boat on WhatsApp.</p><button class="btn b2" onclick="done=false;draft={};friends=[{first:'',last:''}];sex='';render()">New booking</button></div>`:
 `<form class="card" onsubmit="return sendB(event)"><div class="r"><div><label>First name</label><input id="f" required value="${esc(draft.f||'')}"></div><div><label>Last name</label><input id="l" required value="${esc(draft.l||'')}"></div></div>
 <label>WhatsApp number</label><input id="w" type="tel" required placeholder="+1 305 …" value="${esc(draft.w||'')}"><label>Nationality</label><input id="n" required value="${esc(draft.n||'')}">
 <label>You are</label><div class="seg">${['F','G'].map(x=>`<button type="button" ${full(x)?'disabled style="opacity:.4"':''} class="${sex===x?'on '+(x==='F'?'f':''):''}" onclick="sex='${x}';keep();render()">${x==='F'?'Girl':'Guy'} · $${x==='F'?cfg.priceF:cfg.priceG}${full(x)?' · Full':''}</button>`).join('')}</div>${sex?`<p class="mu" style="margin:8px 0 0">Your price: <b style="color:var(--c)">$${sex==='F'?cfg.priceF:cfg.priceG}</b></p>`:''}
 <label>Which friends do you want to be with? (groups of ${CAP} max, including you)</label>
 ${friends.map((x,i)=>`<div class="fr"><input placeholder="First name" value="${esc(x.first)}" oninput="friends[${i}].first=this.value"><input placeholder="Last name" value="${esc(x.last)}" oninput="friends[${i}].last=this.value"><button type="button" class="x" onclick="friends.splice(${i},1);keep();render()">✕</button></div>`).join('')}
 ${friends.length<CAP-1?`<button type="button" class="b2" onclick="friends.push({first:'',last:''});keep();render()">+ Add a friend</button>`:''}
 <button class="btn">Book my spot</button></form>`)+
 `<h2>Boat details</h2><div class="card det">${esc(cfg.details)}</div>`+
 (ph.length?`<div class="car" id="car">${ph.map(p=>`<img src="${p.src}" alt="">`).join('')}</div>`:'')+`<p style="text-align:center;margin-top:48px"><a href="#admin" style="color:#34344c;font-size:10px;text-decoration:none">staff</a></p>`;
}
function full(x){const n=cfg.boats.length,y=x==='F'?'G':'F',mine=authed?bookings.filter(b=>b.sex===x).length:pub[x],oth=authed?bookings.length-mine:pub[y];return mine>=n*cfg.seats-Math.max(oth,n*cfg.minG)}
let draft={};function keep(){['f','l','w','n'].forEach(k=>{const e=$('#'+k);if(e)draft[k]=e.value})}
async function sendB(e){e.preventDefault();if(!sex){alert('Pick Girl or Guy');return false}
 if(full(sex)){alert('Sorry, this category is full');return false}
 const fr=friends.filter(x=>x.first.trim()||x.last.trim());
 await store.add('bookings',uid(),{first:$('#f').value.trim(),last:$('#l').value.trim(),wa:$('#w').value.trim(),nat:$('#n').value.trim(),sex,friends:fr,boat:null,t:Date.now()});
 done=true;render();return false}
let carT;function startCar(){clearInterval(carT);const c=$('#car');if(!c)return;carT=setInterval(()=>{const w=c.clientWidth+10;c.scrollLeft+w*1.5>=c.scrollWidth?c.scrollTo({left:0,behavior:'smooth'}):c.scrollBy({left:w,behavior:'smooth'})},3500)}
/* ===== placement auto ===== */
function groups(list){const par={};const f=x=>par[x]===x?x:(par[x]=f(par[x]));list.forEach(b=>par[b.id]=b.id);
 const all=bookings;const byName={};all.forEach(b=>{byName[norm(b.first+' '+b.last)]=b;byName[norm(b.last+' '+b.first)]=b});
 list.forEach(b=>(b.friends||[]).forEach(fr=>{const c=byName[norm(fr.first+' '+fr.last)];if(c&&par[c.id]&&c.id!==b.id)par[f(c.id)]=f(b.id)}));
 const g={};list.forEach(b=>(g[f(b.id)]=g[f(b.id)]||[]).push(b));return Object.values(g)}
async function autoPlace(all){const boats=cfg.boats,S=cfg.seats,m=cfg.minG,mx=S-m,oF={},oG={};boats.forEach(b=>{oF[b.id]=0;oG[b.id]=0});
 const ok=id=>id&&oF.hasOwnProperty(id);
 const target=all?bookings:bookings.filter(b=>!ok(b.boat));
 if(!all)bookings.forEach(b=>{if(ok(b.boat))(b.sex==='F'?oF:oG)[b.boat]++});
 const upd={};
 const fit=(bt,mem)=>{let f=oF[bt.id],g=oG[bt.id],n=0,d=0;mem.forEach(p=>{if(f+g>=S)return;if(p.sex==='F'){if(f<mx){if(f<m)d++;f++;n++}}else if(g<mx){if(g<m)d++;g++;n++}});return[n,d]};
 groups(target).sort((a,b)=>b.length-a.length).forEach(g=>{
  const anchor=!all&&g.map(x=>x.boat).find(ok);let rest=[...g];
  while(rest.length){const sc=bt=>{const[n,d]=fit(bt,rest);return n+d*.3+(bt.id===anchor?.5:0)};const bt=[...boats].sort((a,b)=>sc(b)-sc(a))[0];
   if(!bt||!fit(bt,rest)[0])break;const left=[];
   rest.forEach(p=>{const o=p.sex==='F'?oF:oG;if(oF[bt.id]+oG[bt.id]<S&&o[bt.id]<mx){o[bt.id]++;upd[p.id]=bt.id}else left.push(p)});rest=left}
  rest.forEach(p=>upd[p.id]=null)});
 for(const p of bookings){if(p.id in upd&&upd[p.id]!==(p.boat||null))await store.set('bookings',p.id,{...strip(p),boat:upd[p.id]})}
 if(Object.values(upd).includes(null))alert('No seats left: add a boat or change the limits, then re-run the assignment.')}
const strip=p=>{const{id,...r}=p;return r};
/* ===== admin ===== */
function adminView(){
 if(!authed)return `<div class="logo"><a class="b2" href="#" onclick="location.hash='';return false" style="text-decoration:none;color:inherit;display:inline-block">← Back</a><div class="logo">LORZY EVENTS – ADMIN</div><div class="card"><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pin" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">Log in</button></div>`;
 const T=[['boats','Boats'],['req','Requests ('+bookings.length+')'],['pay','Payments'],['page','Client page']];
 return `<div class="logo"><a class="b2" href="#" onclick="location.hash='';return false" style="text-decoration:none;color:inherit;display:inline-block">← Back</a><div class="logo">LORZY EVENTS – ADMIN</div><div class="tabs">${T.map(t=>`<button class="b2 ${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}<a class="b2" style="text-decoration:none;color:inherit" href="#" onclick="location.hash='';return false">View client page</a><button class="b2" onclick="logout()">Log out</button></div>`+({boats:boatsV,req:reqV,pay:payV,page:pageV}[tab])()}
async function login(){const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pin').value});if(error)return alert('Wrong email or password');authed=true;subB();render()}
function pRow(p){return `<div class="p"><span class="tag ${p.sex==='F'?'tf':'tg'}">${p.sex==='F'?'F':'G'}</span>${p.paid?'<span class="tag" style="background:#6dff9c">PAID</span>':''}<span class="n">${esc(p.first)} ${esc(p.last)}<br><span class="mu">${esc(p.nat)} · ${esc(p.wa)}${(p.friends||[]).length?' · friends: '+esc(p.friends.map(f=>f.first+' '+f.last).join(', ')):''}</span></span>
 <select onchange="mv('${p.id}',this.value)"><option value="">Unassigned</option>${cfg.boats.map(b=>`<option value="${b.id}" ${p.boat===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><button class="x" onclick="rm('${p.id}')">🗑</button></div>`}
function bad(f,g){const m=cfg.minG,t=f+g;if(!t)return'';if(t>cfg.seats||f>cfg.seats-m||g>cfg.seats-m)return'⚠ over limit';if(f<m)return'⚠ needs '+(m-f)+' more girl(s)';if(g<m)return'⚠ needs '+(m-g)+' more guy(s)';return''}
function boatsV(){const un=bookings.filter(p=>!p.boat||!cfg.boats.some(b=>b.id===p.boat));
 return `<div class="bar" style="margin-bottom:12px"><button class="b2" onclick="autoPlace(false)">⚡ Auto-assign unassigned</button><button class="b2" onclick="if(confirm('Re-assign everyone (overwrites your manual changes)?'))autoPlace(true)">↻ Re-assign all</button><button class="b2" onclick="addB()">+ Boat (${cfg.boats.length}/${MAXB})</button><button class="b2" onclick="addP()">+ Add a person</button></div><div class="grid">`+
 cfg.boats.map((b,i)=>{const ps=bookings.filter(p=>p.boat===b.id),f=ps.filter(p=>p.sex==='F').length;
  return `<div class="card bt"><input value="${esc(b.name)}" placeholder="Boat name" onchange="cfg.boats[${i}].name=this.value;saveCfg()"><input value="${esc(b.captain)}" placeholder="Captain" onchange="cfg.boats[${i}].captain=this.value;saveCfg()">
  <div class="cnt ${bad(f,ps.length-f)?'full':''}">${ps.length}/${cfg.seats} · ${f} girls · ${ps.length-f} guys ${bad(f,ps.length-f)}</div>${ps.map(pRow).join('')||'<span class="mu">Empty</span>'}${cfg.boats.length>1&&!ps.length?`<button class="x" onclick="delB(${i})">Delete this boat</button>`:''}</div>`}).join('')+
 `<div class="card bt"><h3>Unassigned (${un.length})</h3>${un.map(pRow).join('')||'<span class="mu">Nobody</span>'}</div></div>`}
function reqV(){return `<div class="card">${[...bookings].sort((a,b)=>b.t-a.t).map(pRow).join('')||'<span class="mu">No requests</span>'}</div>`}
function pageV(){return `<div class="card"><label>Title</label><input value="${esc(cfg.title)}" onchange="cfg.title=this.value;saveCfg()"><label>Date / line under the title</label><input value="${esc(cfg.date)}" onchange="cfg.date=this.value;saveCfg()"><label>Tagline</label><input value="${esc(cfg.desc)}" onchange="cfg.desc=this.value;saveCfg()"><label>Boat details</label><textarea rows="6" onchange="cfg.details=this.value;saveCfg()">${esc(cfg.details)}</textarea></div>
 <div class="card"><div class="r"><div><label>Girl price ($)</label><input type="number" value="${cfg.priceF}" onchange="cfg.priceF=+this.value;saveCfg()"></div><div><label>Guy price ($)</label><input type="number" value="${cfg.priceG}" onchange="cfg.priceG=+this.value;saveCfg()"></div><div><label>Seats per boat</label><input type="number" min="1" max="30" value="${cfg.seats}" onchange="cfg.seats=+this.value;saveCfg()"></div><div><label>Min of each gender per boat</label><input type="number" min="0" max="12" value="${cfg.minG}" onchange="cfg.minG=+this.value;saveCfg()"></div></div></div>
 <div class="card"><label>Carousel photos</label><div class="ph">${photos.sort((a,b)=>a.o-b.o).map(p=>`<div><img src="${p.src}"><button class="x" onclick="store.del('photos','${p.id}')">✕</button></div>`).join('')}</div><label>Add photos</label><input type="file" accept="image/*" multiple onchange="upl(this.files);this.value=''"></div>`}
function payV(){const pr=p=>p.sex==='F'?cfg.priceF:cfg.priceG,paid=bookings.filter(p=>p.paid),due=bookings.filter(p=>!p.paid),sum=l=>l.reduce((a,p)=>a+pr(p),0);
 return `<div class="r" style="margin-bottom:12px"><div class="card"><div class="mu">Collected (${paid.length})</div><b style="font-size:22px;color:#6dff9c">$${sum(paid)}</b></div><div class="card"><div class="mu">Outstanding (${due.length})</div><b style="font-size:22px;color:var(--p)">$${sum(due)}</b></div></div><div class="card">${[...bookings].sort((a,b)=>(a.paid?1:0)-(b.paid?1:0)||a.first.localeCompare(b.first)).map(p=>`<div class="p"><span class="tag ${p.sex==='F'?'tf':'tg'}">${p.sex}</span><span class="n">${esc(p.first)} ${esc(p.last)}<br><span class="mu">$${pr(p)} · ${esc(p.wa)}</span></span><button class="b2" style="${p.paid?'background:#6dff9c;color:#07070d':''}" onclick="pay('${p.id}')">${p.paid?'Paid ✓':'Unpaid'}</button></div>`).join('')||'<span class="mu">No bookings</span>'}</div>`}
function pay(id){const p=bookings.find(x=>x.id===id);store.set('bookings',id,{...strip(p),paid:!p.paid})}
function mv(id,b){const p=bookings.find(x=>x.id===id);store.set('bookings',id,{...strip(p),boat:b||null})}
function rm(id){if(confirm('Delete this person?'))store.del('bookings',id)}
function addB(){if(cfg.boats.length>=MAXB)return alert('8 boats max');cfg.boats.push({id:'b'+uid(),name:'Boat '+(cfg.boats.length+1),captain:''});saveCfg()}
function delB(i){cfg.boats.splice(i,1);saveCfg()}
function addP(){const f=prompt('First name?');if(!f)return;const l=prompt('Last name?')||'';const s=(prompt('F (girl) or G (guy)?')||'G').toUpperCase().startsWith('F')?'F':'G';store.set('bookings',uid(),{first:f,last:l,wa:prompt('WhatsApp ?')||'',nat:prompt('Nationality?')||'',sex:s,friends:[],boat:null,t:Date.now(),manual:true})}
function upl(files){[...files].forEach(f=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);store.set('photos',uid(),{src:c.toDataURL('image/jpeg',.65),o:Date.now()})};im.src=URL.createObjectURL(f)})}
/* ===== init ===== */
let pub={F:0,G:0},subbed=false;
async function refreshPub(){const{data}=await SB.rpc('get_counts');if(data){pub=data;if(!authed&&!busy())render()}}
function subB(){if(subbed)return;subbed=true;store.sub('bookings',r=>{bookings=r;if(!busy())render()})}
async function logout(){await SB.auth.signOut();authed=false;subbed=false;bookings=[];render()}
window.addEventListener('hashchange',render);
(async()=>{const{data}=await SB.auth.getSession();authed=!!data.session;
 store.sub('cfg',r=>{const m=r.find(x=>x.id==='main');cfg=m?{...DEF,...m}:{...DEF};if(!busy())render()});
 store.sub('photos',r=>{photos=r;if(!busy())render()});
 if(authed)subB();refreshPub();setInterval(refreshPub,30000);render()})();
</script></body></html>
