.w{max-width:760px;margin:auto;padding:20px 16px 60px}.wide{max-width:1200px}
h1{font-size:34px;margin:6px 0;letter-spacing:.5px}h2{font-size:18px;margin:26px 0 10px}
.logo{font-weight:900;letter-spacing:4px;color:var(--c);font-size:14px;text-align:center;margin:10px 0}
.sub{color:var(--mu);text-align:center;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0b0b14;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--c);border-color:transparent}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:linear-gradient(90deg,var(--c),var(--p));color:#07070d;border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;width:100%;margin-top:14px}
.b2{background:#1c1c2c;color:var(--tx);border:1px solid var(--line);width:auto;margin:0;padding:8px 12px;font-size:13px;font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0b0b14;color:var(--tx);cursor:pointer;font:inherit}.seg .on{background:var(--c);color:#07070d;font-weight:800}.seg .on.f{background:var(--p)}
.fr{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;border-radius:16px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;object-fit:cover;border-radius:16px}
.det{white-space:pre-line;color:#d6d6e6}

 done=true;render();const u=payUrl(sex,id);if(u)setTimeout(()=>{location.href=u},900);return false}
let carT;function startCar(){clearInterval(carT);const c=$('#car');if(!c)return;const dots=()=>{const i=Math.round(c.scrollLeft/c.clientWidth);document.querySelectorAll('#cd i').forEach((d,k)=>d.classList.toggle('on',k===i))};c.onscroll=dots;dots();if(c.children.length>1)carT=setInterval(()=>carGo(1),5000)}
function carGo(d){const c=$('#car');if(!c)return;const n=c.children.length,i=Math.round(c.scrollLeft/c.clientWidth)+d;c.scrollTo({left:((i+n)%n)*c.clientWidth,behavior:'smooth'})}
/* ===== placement auto ===== */
function groups(list){const par={};const f=x=>par[x]===x?x:(par[x]=f(par[x]));list.forEach(b=>par[b.id]=b.id);
 const all=bookings;const byName={};all.forEach(b=>{byName[norm(b.first+' '+b.last)]=b;byName[norm(b.last+' '+b.first)]=b});
 list.forEach(b=>(b.friends||[]).forEach(fr=>{const c=byName[norm(fr.first+' '+fr.last)];if(c&&par[c.id]&&c.id!==b.id)par[f(c.id)]=f(b.id)}));
 const g={};list.forEach(b=>(g[f(b.id)]=g[f(b.id)]||[]).push(b));return Object.values(g)}
async function autoPlace(all){const boats=cfg.boats,S=cfg.seats,m=cfg.minG,mx=S-m,oF={},oG={};boats.forEach(b=>{oF[b.id]=0;oG[b.id]=0});
 const ok=id=>id&&oF.hasOwnProperty(id);
 const target=all?bookings:bookings.filter(b=>!ok(b.boat));
 if(!all)bookings.forEach(b=>{if(ok(b.boat))(b.sex==='F'?oF:oG)[b.boat]++});
 const upd={};
 const fit=(bt,mem)=>{let f=oF[bt.id],g=oG[bt.id],n=0,d=0;mem.forEach(p=>{if(f+g>=S)return;if(p.sex==='F'){if(f<mx){if(f<m)d++;f++;n++}}else if(g<mx){if(g<m)d++;g++;n++}});return[n,d]};
 groups(target).sort((a,b)=>b.length-a.length).forEach(g=>{
  const anchor=!all&&g.map(x=>x.boat).find(ok);let rest=[...g];
  while(rest.length){const sc=bt=>{const[n,d]=fit(bt,rest);return n+d*.3+(bt.id===anchor?.5:0)};const bt=[...boats].sort((a,b)=>sc(b)-sc(a))[0];
   if(!bt||!fit(bt,rest)[0])break;const left=[];
   rest.forEach(p=>{const o=p.sex==='F'?oF:oG;if(oF[bt.id]+oG[bt.id]<S&&o[bt.id]<mx){o[bt.id]++;upd[p.id]=bt.id}else left.push(p)});rest=left}
  rest.forEach(p=>upd[p.id]=null)});
 for(const p of bookings){if(p.id in upd&&upd[p.id]!==(p.boat||null))await store.set('bookings',p.id,{...strip(p),boat:upd[p.id]})}
 if(Object.values(upd).includes(null))alert('No seats left: add a boat or change the limits, then re-run the assignment.')}
const strip=p=>{const{id,...r}=p;return r};
/* ===== admin ===== */
function adminView(){
 if(!authed)return `<div class="logo"><a class="b2" href="#" onclick="location.hash='';return false" style="text-decoration:none;color:inherit;display:inline-block">← Back</a><div class="logo">LORZY EVENTS – ADMIN</div><div class="card"><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pin" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">Log in</button></div>`;
 const T=[['stats','Overview'],['boats','Boats'],['req','Requests ('+bookings.length+')'],['pay','Payments'],['msg','Message'],['page','Client page']];
 return `<div class="logo"><a class="b2" href="#" onclick="location.hash='';return false" style="text-decoration:none;color:inherit;display:inline-block">← Back</a><div class="logo">LORZY EVENTS – ADMIN</div>${evBar()}<div class="tabs">${T.map(t=>`<button class="b2 ${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}<a class="b2" style="text-decoration:none;color:inherit" href="#" onclick="location.hash='';return false">View client page</a><button class="b2" onclick="logout()">Log out</button></div>`+`<input class="srch" placeholder="Search name or phone…" value="${esc(q)}" oninput="q=this.value;$('#ab').innerHTML=body()"><div id="ab">${body()}</div>`}
let q='';const hit=p=>!q||norm(p.first+' '+p.last+' '+(p.wa||'')+' '+(p.nat||'')+' '+(p.id||'').slice(0,6)).includes(norm(q));const body=()=>({stats:statsV,boats:boatsV,req:reqV,pay:payV,msg:msgV,page:pageV}[tab])();
let bm='',bf='all',sentSet=new Set();
const recips=()=>bookings.filter(p=>hit(p)&&(bf==='all'||(bf==='paid'?p.paid:bf==='unpaid'?!p.paid:p.boat===bf)));
function msgV(){const L=recips();return `<div class="card"><label>Message ({name} = first name)</label><textarea rows="5" oninput="bm=this.value">${esc(bm)}</textarea><label>Send to</label><select onchange="bf=this.value;$('#ab').innerHTML=body()"><option value="all">Everyone</option><option value="paid" ${bf==='paid'?'selected':''}>Paid only</option><option value="unpaid" ${bf==='unpaid'?'selected':''}>Not paid yet</option>${cfg.boats.map(b=>`<option value="${b.id}" ${bf===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><div class="bar" style="margin-top:10px"><button class="b2" onclick="vcf()">Download contacts (.vcf)</button><button class="b2" onclick="copyNums()">Copy numbers</button></div></div><div class="card"><div class="mu">${L.length} people. Tap Send on each: WhatsApp opens with your message ready.</div>${L.map(p=>`<div class="p"><span class="n">${esc(p.first)} ${esc(p.last)}</span><button class="b2" ${sentSet.has(p.id)?'style="opacity:.5"':''} onclick="sendOne('${p.id}')">${sentSet.has(p.id)?'Sent ✓':'Send'}</button></div>`).join('')}</div>`}
function sendOne(id){const p=bookings.find(x=>x.id===id);if(!bm.trim())return alert('Write your message first');sentSet.add(id);window.open('https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(bm.replace(/\{name\}/g,p.first)),'_blank');$('#ab').innerHTML=body()}
function vcf(){const t=recips().map(p=>`BEGIN:VCARD\nVERSION:3.0\nFN:${p.first} ${p.last} (${cfg.title})\nTEL;TYPE=CELL:+${waNum(p)}\nEND:VCARD`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/vcard'}));a.download='boat-party-contacts.vcf';document.body.appendChild(a);a.click();a.remove()}
function copyNums(){const t=recips().map(p=>'+'+waNum(p)).join(', ');navigator.clipboard.writeText(t).then(()=>alert('Copied '+recips().length+' numbers'),()=>prompt('Copy:',t))}
const boatTxt=(b,n)=>{const ps=bookings.filter(p=>p.boat===b.id);return b.name+(b.captain?' (Captain: '+b.captain+')':'')+'\n'+(ps.map((p,i)=>(i+1)+'. '+p.first+' '+p.last+' ('+p.sex+')'+(n?' +'+waNum(p):'')).join('\n')||'-')};
const clip=t=>navigator.clipboard.writeText(t).then(()=>alert('Copied'),()=>prompt('Copy:',t));
function copyBoat(i,n){clip(boatTxt(cfg.boats[i],n))}
function copyAll(){clip(cfg.boats.map(b=>boatTxt(b,0)).join('\n\n'))}
function sold(x){cfg['sold'+x]=!cfg['sold'+x];saveCfg()}
async function login(){const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pin').value});if(error)return alert('Wrong email or password');authed=true;subB();render()}
function pRow(p){return `<div class="p"><span class="tag ${p.sex==='F'?'tf':'tg'}">${p.sex==='F'?'F':'G'}</span>${p.paid?'<span class="tag" style="background:#6dff9c">PAID</span>':''}<span class="n">${esc(p.first)} ${esc(p.last)}<br><span class="mu">${esc(p.nat)} · ${esc(p.wa)} · #${(p.id||'').slice(0,6).toUpperCase()}${(p.friends||[]).length?' · friends: '+esc(p.friends.map(f=>f.first+' '+f.last).join(', ')):''}</span></span>
 <select onchange="mv('${p.id}',this.value)"><option value="">Unassigned</option>${cfg.boats.map(b=>`<option value="${b.id}" ${p.boat===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><button class="x" onclick="rm('${p.id}')">🗑</button></div>`}
function bad(f,g){const m=cfg.minG,t=f+g;if(!t)return'';if(t>cfg.seats||f>cfg.seats-m||g>cfg.seats-m)return'⚠ over limit';if(f<m)return'⚠ needs '+(m-f)+' more girl(s)';if(g<m)return'⚠ needs '+(m-g)+' more guy(s)';return''}
function boatsV(){const un=bookings.filter(p=>!p.boat||!cfg.boats.some(b=>b.id===p.boat));
 return `<div class="bar" style="margin-bottom:12px"><button class="b2" onclick="autoPlace(false)">⚡ Auto-assign unassigned</button><button class="b2" onclick="if(confirm('Re-assign everyone (overwrites your manual changes)?'))autoPlace(true)">↻ Re-assign all</button><button class="b2" onclick="addB()">+ Boat (${cfg.boats.length}/${MAXB})</button><button class="b2" onclick="addP()">+ Add a person</button><button class="b2" onclick="copyAll()">Copy all boats</button></div><div class="grid">`+
 cfg.boats.map((b,i)=>{const ps=bookings.filter(p=>p.boat===b.id),f=ps.filter(p=>p.sex==='F').length;
  return `<div class="card bt"><input value="${esc(b.name)}" placeholder="Boat name" onchange="cfg.boats[${i}].name=this.value;saveCfg()"><input value="${esc(b.captain)}" placeholder="Captain" onchange="cfg.boats[${i}].captain=this.value;saveCfg()">
  <div class="cnt ${bad(f,ps.length-f)?'full':''}">${ps.length}/${cfg.seats} · ${f} girls · ${ps.length-f} guys ${bad(f,ps.length-f)}</div><div class="bar" style="margin-bottom:6px"><button class="b2" onclick="copyBoat(${i},0)">Copy names</button><button class="b2" onclick="copyBoat(${i},1)">Copy + numbers</button></div>${ps.filter(hit).map(pRow).join('')||'<span class="mu">Empty</span>'}${cfg.boats.length>1&&!ps.length?`<button class="x" onclick="delB(${i})">Delete this boat</button>`:''}</div>`}).join('')+
 `<div class="card bt"><h3>Unassigned (${un.length})</h3>${un.filter(hit).map(pRow).join('')||'<span class="mu">Nobody</span>'}</div></div>`}
function reqV(){return `<div class="card">${[...bookings].filter(hit).sort((a,b)=>b.t-a.t).map(pRow).join('')||'<span class="mu">No requests</span>'}</div>`}
function pageV(){return `<div class="card"><label>Title</label><input value="${esc(cfg.title)}" onchange="cfg.title=this.value;saveCfg()"><label>Date</label><input type="date" value="${esc(cfg.day||'')}" onchange="cfg.day=this.value;saveCfg()"><label>Time (e.g. 7PM – 11PM)</label><input value="${esc(cfg.time||'')}" onchange="cfg.time=this.value;saveCfg()"><label>Meeting point / location</label><input value="${esc(cfg.place||'')}" onchange="cfg.place=this.value;saveCfg()"><label>Visible to the public</label><div class="seg"><button class="${!cfg.hidden?'on':''}" onclick="cfg.hidden=false;saveCfg()">Visible</button><button class="${cfg.hidden?'on f':''}" onclick="cfg.hidden=true;saveCfg()">Hidden (draft)</button></div><label>Tagline</label><input value="${esc(cfg.desc)}" onchange="cfg.desc=this.value;saveCfg()"><label>Boat details (one per line, like Departure: 7PM)</label><textarea rows="6" onchange="cfg.details=this.value;saveCfg()">${esc(cfg.details)}</textarea></div>
 <div class="card"><div class="r"><div><label>Girl price ($)</label><input type="number" value="${cfg.priceF}" onchange="cfg.priceF=+this.value;saveCfg()"></div><div><label>Guy price ($)</label><input type="number" value="${cfg.priceG}" onchange="cfg.priceG=+this.value;saveCfg()"></div><div><label>Seats per boat</label><input type="number" min="1" max="30" value="${cfg.seats}" onchange="cfg.seats=+this.value;saveCfg()"></div><div><label>Min of each gender per boat</label><input type="number" min="0" max="12" value="${cfg.minG}" onchange="cfg.minG=+this.value;saveCfg()"></div></div></div>
 <div class="card"><label>Payment link – girls (Stripe)</label><input value="${esc(cfg.linkF||'')}" placeholder="https://buy.stripe.com/…" onchange="cfg.linkF=this.value.trim();saveCfg()"><label>Payment link – guys (Stripe)</label><input value="${esc(cfg.linkG||'')}" placeholder="https://buy.stripe.com/…" onchange="cfg.linkG=this.value.trim();saveCfg()"><label>Instagram handle (e.g. yourhandle)</label><input value="${esc(cfg.insta||'')}" onchange="cfg.insta=this.value.trim();saveCfg()"><label>Payment note (shown after booking)</label><input value="${esc(cfg.payNote||'')}" onchange="cfg.payNote=this.value;saveCfg()"><label>Contact link (WhatsApp / Instagram)</label><input value="${esc(cfg.contact||'')}" placeholder="https://wa.me/…" onchange="cfg.contact=this.value.trim();saveCfg()"><label>Good to know (optional)</label><textarea rows="4" onchange="cfg.faq=this.value;saveCfg()">${esc(cfg.faq||'')}</textarea></div>
 <div class="card"><div class="mu" style="margin-bottom:6px">Home page (same for every date)</div><label>Title</label><input value="${esc(site().homeTitle||'')}" placeholder="Pick a date" onchange="saveSite('homeTitle',this.value)"><label>Intro line</label><input value="${esc(site().homeText||'')}" placeholder="Boat parties · Miami" onchange="saveSite('homeText',this.value)"><label>Info lines (one per line)</label><textarea rows="4" onchange="saveSite('homeInfo',this.value)">${esc(site().homeInfo||'')}</textarea></div>
 <div class="card"><label>WhatsApp message sent after payment — you can use {name} {date} {ticket} {instagram} {boat} {amount}</label><textarea rows="6" onchange="cfg.waMsg=this.value;saveCfg()">${esc(cfg.waMsg||defMsg())}</textarea><button class="b2" style="margin-top:8px" onclick="cfg.waMsg='';saveCfg()">Reset to default</button></div>
 <div class="card"><label>Logo (PNG, replaces the name at the top of the site)</label>${(photos.find(p=>p.id==='logo')||{}).src?`<div style="background:#000;padding:10px;margin:6px 0"><img src="${(photos.find(p=>p.id==='logo')||{}).src}" style="max-height:70px"></div><button class="b2" onclick="store.del('photos','logo')">Remove logo</button>`:''}<input type="file" accept="image/png,image/*" onchange="upLogo(this.files[0]);this.value=''"></div>
 <div class="card"><label>Carousel photos</label><div class="ph">${photos.filter(p=>!['logo','site'].includes(p.id)).sort((a,b)=>a.o-b.o).map(p=>`<div><img src="${p.src}"><button class="x" onclick="store.del('photos','${p.id}')">✕</button></div>`).join('')}</div><label>Add photos</label><input type="file" accept="image/*" multiple onchange="upl(this.files);this.value=''"></div>`}
function statsV(){const key=t=>norm(t).split(' ').sort().join(' '),F=bookings.filter(p=>p.sex==='F').length,G=bookings.length-F;
 const reg=new Set(bookings.map(b=>key(b.first+' '+b.last))),m={};
 bookings.forEach(b=>(b.friends||[]).forEach(f=>{const k=key(f.first+' '+f.last);if(!k||reg.has(k))return;(m[k]=m[k]||{n:(f.first+' '+f.last).trim(),by:[]}).by.push(b.first+' '+b.last)}));
 const miss=Object.values(m).sort((a,b)=>b.by.length-a.by.length),seats=cfg.boats.length*cfg.seats;
 return `<div class="card"><div class="mu" style="margin-bottom:8px">Sales status (public page)</div><div class="bar">${['F','G'].map(x=>`<button class="b2" style="${cfg['sold'+x]?'background:var(--p);color:#07070d':''}" onclick="sold('${x}')">${x==='F'?'Girls':'Guys'}: ${cfg['sold'+x]?'SOLD OUT':'Open'}</button>`).join('')}</div></div><div class="r" style="margin-bottom:12px"><div class="card"><div class="mu">Girls registered</div><b style="font-size:26px;color:var(--p)">${F}</b></div><div class="card"><div class="mu">Guys registered</div><b style="font-size:26px;color:var(--c)">${G}</b></div></div><div class="card"><div class="mu">Total ${bookings.length} / ${seats} seats · ${cfg.boats.length} boats · ${seats-bookings.length} left</div></div><div class="card"><h3 style="margin:0 0 6px;font-size:15px">Friends named but not registered (${miss.length})</h3>${miss.map(x=>`<div class="p"><span class="n">${esc(x.n)}<br><span class="mu">named by ${esc(x.by.join(', '))}</span></span></div>`).join('')||'<span class="mu">None</span>'}</div>`}
function payV(){const pr=p=>p.sex==='F'?cfg.priceF:cfg.priceG,paid=bookings.filter(p=>p.paid),due=bookings.filter(p=>!p.paid),sum=l=>l.reduce((a,p)=>a+pr(p),0);
 return `<div class="r" style="margin-bottom:12px"><div class="card"><div class="mu">Collected (${paid.length})</div><b style="font-size:22px;color:#6dff9c">$${sum(paid)}</b></div><div class="card"><div class="mu">Outstanding (${due.length})</div><b style="font-size:22px;color:var(--p)">$${sum(due)}</b></div></div><div class="card">${[...bookings].filter(hit).sort((a,b)=>(a.paid?1:0)-(b.paid?1:0)||a.first.localeCompare(b.first)).map(p=>`<div class="p"><span class="tag ${p.sex==='F'?'tf':'tg'}">${p.sex}</span><span class="n">${esc(p.first)} ${esc(p.last)}<br><span class="mu">$${pr(p)} · ${esc(p.wa)}</span></span><button class="b2" style="${p.paid?'background:#6dff9c;color:#07070d':''}" onclick="pay('${p.id}')">${p.paid?'Paid ✓':'Unpaid'}</button>${p.paid?`<button class="b2" onclick="sendTicket('${p.id}')">Send confirmation</button>`:''}</div>`).join('')||'<span class="mu">No bookings</span>'}</div>`}
function pay(id){const p=bookings.find(x=>x.id===id),mk=!p.paid;store.set('bookings',id,{...strip(p),paid:mk});if(mk&&confirm('Marked as paid. Send the confirmation on WhatsApp now?'))sendTicket(id)}
function waNum(p){let d=(p.wa||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0')){const n=norm(p.nat||''),m=[['fran',33],['ital',39],['swi',41],['suis',41],['belg',32]].find(x=>n.includes(x[0]));if(m)d=m[1]+d.slice(1)}return d}
function sendTicket(id){const p=bookings.find(x=>x.id===id),u=location.origin+location.pathname+'#ticket='+id,bt=(cfg.boats.find(b=>b.id===p.boat)||{}).name||'',m=(cfg.waMsg||defMsg()).replace(/\{name\}/g,p.first).replace(/\{date\}/g,evLabel(cfg)).replace(/\{ticket\}/g,u).replace(/\{instagram\}/g,ig()?'@'+ig():'').replace(/\{boat\}/g,bt).replace(/\{amount\}/g,'$'+price(p.sex));window.open('https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(m),'_blank')}
/* ticket page */
let tk=null,tkLoad=false;let tries=0;const tid=()=>location.hash.startsWith('#ticket=')?location.hash.slice(8):(location.hash==='#paid'?(()=>{try{return localStorage.getItem('lastBooking')}catch(e){return null}})():null);
async function loadTicket(id){let d=null;try{d=(await SB.rpc('get_ticket',{tid:id})).data}catch(e){}tk=d||{err:1};render();if(location.hash==='#paid'&&d&&!d.paid&&++tries<30)setTimeout(()=>loadTicket(id),3000)}
function ticketView(){const id=tid();if(!tk)return '<div class="hero"><p class="mu">Loading ticket…</p></div>';if(tk.err||!tk.first)return '<div class="hero"><h1>Ticket not found</h1></div>';
 const ev=evs.find(x=>x.id===(tk.ev||'main'))||cfg,bt=(ev.boats.find(b=>b.id===tk.boat)||{}).name||'';let q='';if(tk.paid){const o=qrcode(0,'M');o.addData('LORZY-'+id);o.make();q=o.createImgTag(8,8)}
 return `<div class="hero">${brand()}<h1>${esc(ev.title)}</h1><p class="sub">${esc(evLabel(ev))}</p></div><div class="card ok">${tk.paid&&location.hash==='#paid'?'<h2 style="margin:0 0 8px">Payment received. You’re confirmed.</h2>':''}<div style="font-size:20px;font-weight:800">${esc(tk.first)} ${esc(tk.last)}</div><p>${tk.sex==='F'?'Girl':'Guy'}${bt?' · '+esc(bt):''}</p>${tk.paid?`<div style="background:#fff;display:inline-block;padding:12px;border-radius:12px">${q}</div><p><strong>Code ${id.slice(0,6).toUpperCase()}</strong></p><p class="mu">Show this QR code at check-in.</p>${ig()?`<p class="mu">Questions? Instagram @${esc(ig())} · follow us!</p>`:''}`:(location.hash==='#paid'?'<p class="mu">Confirming your payment… this page updates by itself.</p>':'<p class="so">Payment not confirmed yet.</p>')}</div>`}

function mv(id,b){const p=bookings.find(x=>x.id===id);store.set('bookings',id,{...strip(p),boat:b||null})}
function rm(id){if(confirm('Delete this person?'))store.del('bookings',id)}
function addB(){if(cfg.boats.length>=MAXB)return alert('8 boats max');cfg.boats.push({id:'b'+uid(),name:'Boat '+(cfg.boats.length+1),captain:''});saveCfg()}
function delB(i){cfg.boats.splice(i,1);saveCfg()}
function addP(){const f=prompt('First name?');if(!f)return;const l=prompt('Last name?')||'';const s=(prompt('F (girl) or G (guy)?')||'G').toUpperCase().startsWith('F')?'F':'G';store.set('bookings',uid(),{first:f,last:l,wa:prompt('WhatsApp ?')||'',nat:prompt('Nationality?')||'',sex:s,friends:[],boat:null,t:Date.now(),manual:true})}
function upLogo(f){if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,700/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);store.set('photos','logo',{src:c.toDataURL('image/png'),o:-1})};im.src=URL.createObjectURL(f)}
function upl(files){[...files].forEach(f=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);store.set('photos',uid(),{src:c.toDataURL('image/jpeg',.7),o:Date.now()})};im.src=URL.createObjectURL(f)})}
/* ===== init ===== */
let pub={F:0,G:0},subbed=false;
async function refreshPub(){const{data}=await SB.rpc('get_counts',{eid:curEv});if(data){pub=data;if(!authed&&!busy())render()}}
function subB(){if(subbed)return;subbed=true;store.sub('bookings',r=>{allB=r;reB();if(!busy())render()})}
async function logout(){await SB.auth.signOut();authed=false;subbed=false;bookings=[];render()}
window.addEventListener('hashchange',()=>{tkLoad=false;tk=null;tries=0;render()});
(async()=>{const{data}=await SB.auth.getSession();authed=!!data.session;
 store.sub('cfg',r=>{const o=curEv;evs=r.map(x=>({...DEF,...x}));if(!evs.length)evs=[{...DEF,id:'main'}];if(!evs.some(e=>e.id===curEv))curEv=pickEv();cfg=evs.find(e=>e.id===curEv);reB();if(curEv!==o)refreshPub();if(!busy())render()});
 store.sub('photos',r=>{photos=r;if(!busy())render()});
 if(authed)subB();refreshPub();setInterval(refreshPub,30000);render()})();
</script></body></html>
