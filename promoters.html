<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Promoter dashboard</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<style>:root{--bg:#07070d;--card:#12121c;--line:#25253a;--tx:#f4f4fa;--mu:#9a9ab4;--c:#16f3fe;--p:#ffa9c2;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(60% 40% at 85% -5%,#16f3fe22,transparent),#07070d;color:var(--tx);font:15px/1.5 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:640px;margin:auto;padding:22px 16px 60px}h1{font-size:26px;margin:4px 0 2px}.mu{color:var(--mu);font-size:13px}.logo{text-align:center;letter-spacing:5px;font-weight:800;color:var(--c);font-size:13px;margin-bottom:14px}.brand{display:block;margin:0 auto 14px;max-height:80px;max-width:60%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.n{font-size:26px;font-weight:800}
input{width:100%;background:#0b0b14;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px;font:inherit;margin:6px 0}button{background:linear-gradient(90deg,var(--c),var(--p));color:#07070d;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;font:inherit;font-weight:800}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.ok{color:#6dff9c}.wt{color:#ffd166}.lnk{word-break:break-all;background:#0b0b14;padding:9px;border-radius:8px;font-size:13px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body><div class="w" id="app"></div><script>
const SB=supabase.createClient('https://gjkpcybaezrqapjyhacs.supabase.co','sb_publishable_kU32UCX6xzHug58YO2wmTg_nKyTKu_r'),$=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=new URLSearchParams(location.search);let c=q.get('c')||'',k=q.get('k')||'',D=null,evs={},logo='',msg='';
try{if(!c)c=localStorage.getItem('pc')||'';if(!k)k=localStorage.getItem('pk')||''}catch(e){}
async function load(){if(!c||!k){render();return}
 const r=await SB.rpc('promo_stats',{pcode:c.trim(),ptoken:k.trim()});D=r.data;msg=D?'':'Invalid code or key.';
 if(D){try{localStorage.setItem('pc',c);localStorage.setItem('pk',k)}catch(e){}
  const e=await SB.from('cfg').select('id,data');(e.data||[]).forEach(x=>{evs[x.id]=x.data.day?new Date(x.data.day+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):(x.data.title||'')});
  const l=await SB.from('photos').select('data').eq('id','logo').maybeSingle();logo=(l.data&&l.data.data&&l.data.data.src)||''}
 render()}
function render(){const A=$('#app'),head=logo?`<img class="brand" src="${logo}" alt="">`:'<div class="logo">LORZY EVENTS</div>';
 if(!D){A.innerHTML=`${head}<h1>Promoter dashboard</h1><div class="card"><p class="mu">Enter your code and key (they are in the link you were given).</p><input id="c" placeholder="Code" value="${esc(c)}"><input id="k" placeholder="Key" value="${esc(k)}"><button onclick="c=$('#c').value;k=$('#k').value;load()">Open</button><p class="wt">${esc(msg)}</p></div>`;return}
 const pd=D.sales.filter(s=>s.paid),f=pd.filter(s=>s.sex==='F').length,g=pd.length-f,earn=f*D.rateF+g*D.rateG,link=location.origin+location.pathname.replace(/[^/]*$/,'')+'?ref='+encodeURIComponent(c.toLowerCase());
 A.innerHTML=`${head}<h1>${esc(D.name)}</h1><div class="mu">Your sales dashboard</div><div class="g"><div class="card"><div class="mu">Paid sales</div><div class="n">${pd.length}</div><div class="mu">${f} girls · ${g} guys</div></div><div class="card"><div class="mu">Pending</div><div class="n">${D.sales.length-pd.length}</div><div class="mu">not paid yet</div></div><div class="card"><div class="mu">Earned</div><div class="n">$${earn}</div></div><div class="card"><div class="mu">Balance owed</div><div class="n" style="color:var(--p)">$${earn-D.paidOut}</div><div class="mu">paid out $${D.paidOut}</div></div></div>
 <div class="card"><div class="mu">Your link: share it, every paid ticket bought through it counts for you.</div><div class="lnk" style="margin:8px 0">${esc(link)}</div><button onclick="navigator.clipboard.writeText('${link}').then(()=>this.textContent='Copied')">Copy link</button></div>
 <div class="card"><div class="mu" style="margin-bottom:6px">Your sales</div>${D.sales.map(s=>`<div class="row"><span>${esc(s.first)} ${esc(s.last)}. · ${s.sex==='F'?'Girl':'Guy'}<br><span class="mu">${esc(evs[s.ev]||'')}</span></span><span class="${s.paid?'ok':'wt'}">${s.paid?'Paid':'Pending'}</span></div>`).join('')||'<span class="mu">No sales yet. Share your link.</span>'}</div><button onclick="load()">Refresh</button>`}
load();setInterval(()=>{if(D)load()},30000);
</script></body></html>
